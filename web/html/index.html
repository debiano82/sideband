<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sideband · dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-4"><div class="card p-3"><div class="stat" id="c-total">0</div><div class="stat-label">Client totali</div></div></div>
      <div class="col-4"><div class="card p-3"><div class="stat text-success" id="c-online">0</div><div class="stat-label">Online</div></div></div>
      <div class="col-4"><div class="card p-3"><div class="stat text-muted" id="c-offline">0</div><div class="stat-label">Offline</div></div></div>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="h6 mb-3">Sessioni VPN</h2>
        <table class="table align-middle mb-0">
          <thead><tr><th>Client</th><th>Indirizzo WG</th><th>Hardware</th><th>Endpoint</th><th>Ultimo handshake</th><th>Traffico</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/parse/5.3.0/parse.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
